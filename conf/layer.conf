# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-uno-q"
BBFILE_PATTERN_meta-uno-q = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-uno-q = "6"

LAYERDEPENDS_meta-uno-q = "core qcom-distro meta-arduino-qcom"
LAYERSERIES_COMPAT_meta-uno-q = "wrynose"
